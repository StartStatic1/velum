name: APK de depuração

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  teste-e-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"

      - name: Testes do catálogo e APK de depuração
        run: gradle :core:model:test :app:assembleDebug --stacktrace

      - name: Preparar Velum.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/Velum.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: velum-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publicar Velum.apk no release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v0.1.0 --yes --cleanup-tag || true
          gh release create v0.1.0 "$RUNNER_TEMP/Velum.apk" \
            --title "Velum 0.1.0" \
            --notes "APK de teste. Não extraia. Abra o arquivo no celular, permita a instalação, toque em Sintel e depois em Assistir."
